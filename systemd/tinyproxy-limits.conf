# Drop-in for tinyproxy.service -- installed by install.sh when ENABLE_PROXY=1.
#
# Every proxied connection costs two file descriptors (client side and upstream
# side). The distribution default soft limit of 1024 caps tinyproxy at roughly
# 500 clients regardless of MaxClients, and it fails the same quiet way: new
# connections are refused while the process looks healthy.
[Service]
LimitNOFILE=8192
